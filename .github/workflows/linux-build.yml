name: Linux builds

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install per-app dependencies
        run: |
          python -m pip install --upgrade pip
          for app in trezor ledger bitbox; do
            python -m venv "$app/.venv"
            "$app/.venv/bin/pip" install -q --require-hashes -r "$app/requirements.txt"
          done
          python -m pip install -q --require-hashes -r requirements-dev.txt
          for app in trezor ledger bitbox; do
            "$app/.venv/bin/pip" install -q --require-hashes -r requirements-dev.txt
          done

      - name: Lint
        run: ruff check trezor ledger bitbox common docs/make_screenshots.py

      - name: Backend tests
        run: |
          (cd ledger && ../ledger/.venv/bin/python -m pytest -q tests)
          (cd trezor && ../trezor/.venv/bin/python -m pytest -q tests)
          (cd bitbox && ../bitbox/.venv/bin/python -m pytest -q tests)

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools

      - name: Build AppImage and .deb
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
          PY_TREZOR: ${{ github.workspace }}/trezor/.venv/bin/python
          PY_LEDGER: ${{ github.workspace }}/ledger/.venv/bin/python
          PY_BITBOX: ${{ github.workspace }}/bitbox/.venv/bin/python
        run: |
          VERSION="${VERSION#v}"
          ./packaging/build_linux.sh

      - name: Install runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xkb1 libxcb-util1

      - name: Smoke test packaged AppImages
        run: |
          for key in trezor ledger bitbox; do
            appimage=$(ls build/appimage/hwfw-$key-*.AppImage)
            "$appimage" --appimage-version
            if ! QT_QPA_PLATFORM=offscreen timeout 30 \
                "$appimage" --screenshot "/tmp/$key.png"; then
              APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen timeout 30 \
                "$appimage" --screenshot "/tmp/$key.png"
            fi
            test -s "/tmp/$key.png"
            rm -f "/tmp/$key.png"
          done

      - name: Reproducible AppImage
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
          PY_TREZOR: ${{ github.workspace }}/trezor/.venv/bin/python
          PY_LEDGER: ${{ github.workspace }}/ledger/.venv/bin/python
          PY_BITBOX: ${{ github.workspace }}/bitbox/.venv/bin/python
        run: |
          VERSION="${VERSION#v}"
          appimage=$(ls build/appimage/hwfw-trezor-*.AppImage)
          sha256sum "$appimage" > /tmp/first.sha
          ./packaging/build_linux.sh
          sha256sum "$appimage" > /tmp/second.sha
          diff /tmp/first.sha /tmp/second.sha

      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            build/appimage/*.AppImage
            build/deb/*.deb
            build/release/SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ github.run_id }}
          if-no-files-found: error
          path: |
            build/appimage/*.AppImage
            build/deb/*.deb
            build/release/SHA256SUMS
