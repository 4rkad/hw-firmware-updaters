name: Linux builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install per-app dependencies
        run: |
          python -m pip install --upgrade pip
          for app in trezor ledger bitbox; do
            python -m venv "$app/.venv"
            "$app/.venv/bin/pip" install -q -r "$app/requirements.txt"
          done
          ledger/.venv/bin/pip install -q pytest
          python -m pip install -q "ruff==0.17.4"

      - name: Lint
        run: ruff check trezor ledger bitbox common docs/make_screenshots.py

      - name: Backend tests
        run: cd ledger && ../ledger/.venv/bin/python -m pytest -q tests

      - name: Build AppImage and .deb
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
          PY_TREZOR: ${{ github.workspace }}/trezor/.venv/bin/python
          PY_LEDGER: ${{ github.workspace }}/ledger/.venv/bin/python
          PY_BITBOX: ${{ github.workspace }}/bitbox/.venv/bin/python
        run: |
          VERSION="${VERSION#v}"
          ./packaging/build_linux.sh

      - name: Install runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xkb1 libxcb-util1

      - name: Smoke test (start each app headless)
        run: |
          for key in trezor ledger bitbox; do
            QT_QPA_PLATFORM=offscreen timeout 30 \
              "build/dist/hwfw-$key/hwfw-$key" --screenshot "/tmp/$key.png"
            test -s "/tmp/$key.png"
          done

      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            build/appimage/*.AppImage
            build/deb/*.deb
            build/release/SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ github.run_id }}
          if-no-files-found: error
          path: |
            build/appimage/*.AppImage
            build/deb/*.deb
            build/release/SHA256SUMS
