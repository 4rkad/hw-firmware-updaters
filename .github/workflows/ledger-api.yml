name: Ledger API check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Query the Ledger manager API
        run: |
          python -m venv ledger/.venv
          ledger/.venv/bin/pip install -q --require-hashes -r ledger/requirements.txt
          ledger/.venv/bin/python ledger/ledger-updater.py --selftest
